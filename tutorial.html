<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
</head>

<body>
    <h1>Click Event</h1>
    <button id="btnClickEv">Click Me!</button>
    <div id="clickMsg"></div>

    <hr>

    <h1>Effects</h1>
    <!--
        <button id="btnHide">Sembunyikan</button>
        <button id="btnShow">Tampilkan</button>    
    -->

    <button id="btnHideShow">Hide</button>
    <div id="hideShowMsg">SOMETHING SOMETHING</div>

    <hr>

    <h1>Get Value From Input</h1>
    <input type="text" id="inputVal">
    <button id="btnGetVal">Get Value</button>
    <div id="showVal"></div>

    <hr>

    <h1>Add Children</h1>
    <button id="btnMelahirkan">Melahirkan</button>
    <div id="ortu"></div>

    <!-- jQuery Library-->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            $("#btnClickEv").click(function () {
                const $msg = $("#clickMsg");
                if ($(this).text() === "Click Me!") {
                    $(this).text("Click me again!");
                }
                else {
                    $(this).text("Click Me!");
                }
                if ($msg.text() === "") {
                    $msg.text("Button above me is clicked").hide();
                }
                $msg.slideToggle();
            });

            /*
            $("#btnHide").click(function () {
                $("#hideShowMsg").fadeOut();
            });
    
            $("#btnShow").click(function () {
                $("#hideShowMsg").fadeIn();
            });
            */

            $("#btnHideShow").click(function () {
                $("#hideShowMsg").fadeToggle();
                if ($(this).text() === "Hide") {
                    $(this).text("Show");
                }
                else {
                    $(this).text("Hide");
                    $("#hideShowMsg").text("Hide me");
                }
            });

            $("#btnGetVal").click(function () {
                var val = $("#inputVal").val();
                $("#showVal").text(val);
            });

            $("#btnMelahirkan").click(function () {
                $("#ortu").append("<div style='background: deeppink; margin: 2px;'>Anak</div>");
            });
        })
    </script>
</body>

</html>
